[package]
authors.workspace    = true
description          = "sshenv vault file I/O, crypto, and recipient management"
edition.workspace    = true
license.workspace    = true
name                 = "sshenv_vault"
repository.workspace = true
version.workspace    = true

[features]
age-plugin-recipient = ["hardware-recipient", "age/plugin"]
default              = ["ssh-hardening", "rekey", "passphrase-factor", "profile-keys"]
device-seal          = []
device-seal-file     = ["device-seal"]
fail-on-warnings     = ["sshenv_vault_models/fail-on-warnings"]
hardware-recipient   = []
kms-factor           = ["remote-factor"]
linux-secret-service = ["device-seal"]
macos-keychain       = ["device-seal"]
passphrase-factor    = ["argon2"]
profile-keys         = []
recovery-shares      = ["threshold-policies"]
rekey                = []
remote-factor        = []
secure-enclave       = ["device-seal"]
shamir-sharing       = ["recovery-shares"]
ssh-hardening        = []
threshold-policies   = []
tpm-device-seal      = ["device-seal"]
windows-dpapi        = ["device-seal"]

[dependencies]
sshenv_vault_models = { workspace = true }

aes-siv = { workspace = true, features = ["alloc"] }
age     = { workspace = true }
hkdf    = { workspace = true }
sha2    = { workspace = true }
ssh-key = { workspace = true, features = ["ed25519"] }

anyhow = { workspace = true }
argon2 = { workspace = true, optional = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
dirs = { workspace = true }
hex = { workspace = true }
rand_core = { version = "0.6", default-features = false, features = [
    "std",
    "getrandom",
] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
], default-features = false }
zeroize = { workspace = true }

[dev-dependencies]
ssh-key = { version = "0.6", default-features = false, features = [
    "std",
    "alloc",
    "ed25519",
    "rand_core",
] }

[lints]
workspace = true
