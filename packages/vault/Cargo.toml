[package]
authors.workspace    = true
description          = "sshenv vault file I/O, crypto, and recipient management"
edition.workspace    = true
license.workspace    = true
name                 = "sshenv_vault"
repository.workspace = true
version.workspace    = true

[features]
default           = ["ssh-hardening", "rekey", "passphrase-factor"]
passphrase-factor = ["argon2"]
rekey             = []
ssh-hardening     = []

[dependencies]
sshenv_vault_models = { workspace = true }

aes-siv = { workspace = true, features = ["alloc"] }
age     = { workspace = true }
hkdf    = { workspace = true }
sha2    = { workspace = true }
ssh-key = { workspace = true, features = ["ed25519"] }

anyhow = { workspace = true }
argon2 = { workspace = true, optional = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
dirs = { workspace = true }
hex = { workspace = true }
rand_core = { version = "0.6", default-features = false, features = [
    "std",
    "getrandom",
] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
ssh-key = { version = "0.6", default-features = false, features = [
    "std",
    "alloc",
    "ed25519",
    "rand_core",
] }

[lints]
workspace = true
