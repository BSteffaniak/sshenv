[package]
authors.workspace    = true
description          = "SSH-key-backed encrypted vault for environment variables"
edition.workspace    = true
license.workspace    = true
name                 = "sshenv"
repository.workspace = true
version.workspace    = true

[features]
age-plugin-recipient = [
    "hardware-recipient",
    "sshenv_vault/age-plugin-recipient",
]
default = [
    "ssh-hardening",
    "rekey",
    "passphrase-factor",
    "rollback-protection",
    "runtime-hardening",
    "profile-keys",
]
device-seal = ["sshenv_vault/device-seal"]
device-seal-file = ["device-seal", "sshenv_vault/device-seal-file"]
hardware-recipient = ["sshenv_vault/hardware-recipient"]
kms-factor = ["remote-factor", "sshenv_vault/kms-factor"]
linux-secret-service = ["device-seal", "sshenv_vault/linux-secret-service"]
macos-keychain = ["device-seal", "sshenv_vault/macos-keychain"]
passphrase-factor = ["sshenv_vault/passphrase-factor"]
profile-keys = ["sshenv_vault/profile-keys"]
recovery-shares = ["threshold-policies", "sshenv_vault/recovery-shares"]
rekey = ["sshenv_vault/rekey"]
remote-factor = ["sshenv_vault/remote-factor"]
rollback-protection = []
runtime-hardening = []
secure-enclave = ["device-seal", "sshenv_vault/secure-enclave"]
shamir-sharing = ["recovery-shares", "sshenv_vault/shamir-sharing"]
ssh-hardening = ["sshenv_vault/ssh-hardening"]
threshold-policies = ["sshenv_vault/threshold-policies"]
tpm-device-seal = ["device-seal", "sshenv_vault/tpm-device-seal"]
windows-dpapi = ["device-seal", "sshenv_vault/windows-dpapi"]

[[bin]]
name = "sshenv"
path = "src/main.rs"

[dependencies]
sshenv_cli_models = { workspace = true }
sshenv_shims      = { workspace = true }
sshenv_vault      = { workspace = true }

age        = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
dirs       = { workspace = true }
hex        = { workspace = true }
libc       = { workspace = true }
rpassword  = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
ssh-key    = { workspace = true, features = ["ed25519"] }
tempfile   = { workspace = true }
toml       = { workspace = true }
zeroize    = { workspace = true }

[dev-dependencies]
rand_core = { version = "0.6", default-features = false, features = [
    "std",
    "getrandom",
] }
ssh-key = { version = "0.6", default-features = false, features = [
    "std",
    "alloc",
    "ed25519",
    "rand_core",
] }

[lints]
workspace = true
