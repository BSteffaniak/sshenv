[package]
authors.workspace    = true
description          = "SSH-key-backed encrypted vault for environment variables"
edition.workspace    = true
license.workspace    = true
name                 = "sshenv"
repository.workspace = true
version.workspace    = true

[features]
default             = ["ssh-hardening", "rekey", "passphrase-factor", "rollback-protection"]
device-seal         = ["sshenv_vault/device-seal"]
device-seal-file    = ["device-seal", "sshenv_vault/device-seal-file"]
macos-keychain      = ["device-seal", "sshenv_vault/macos-keychain"]
passphrase-factor   = ["sshenv_vault/passphrase-factor"]
rekey               = ["sshenv_vault/rekey"]
rollback-protection = []
ssh-hardening       = ["sshenv_vault/ssh-hardening"]

[[bin]]
name = "sshenv"
path = "src/main.rs"

[dependencies]
sshenv_cli_models = { workspace = true }
sshenv_shims      = { workspace = true }
sshenv_vault      = { workspace = true }

age       = { workspace = true }
anyhow    = { workspace = true }
clap      = { workspace = true }
dirs      = { workspace = true }
libc      = { workspace = true }
rpassword = { workspace = true }
serde     = { workspace = true }
tempfile  = { workspace = true }
toml      = { workspace = true }
zeroize   = { workspace = true }

[dev-dependencies]
rand_core = { version = "0.6", default-features = false, features = [
    "std",
    "getrandom",
] }
ssh-key = { version = "0.6", default-features = false, features = [
    "std",
    "alloc",
    "ed25519",
    "rand_core",
] }

[lints]
workspace = true
