[package]
authors.workspace    = true
description          = "sshenv shim generation and bindings file I/O"
edition.workspace    = true
license.workspace    = true
name                 = "sshenv_shims"
repository.workspace = true
version.workspace    = true

[features]
fail-on-warnings      = ["sshenv_shims_models/fail-on-warnings"]
simulated-directories = ["switchy_fs/simulator"]

[dependencies]
sshenv_shims_models = { workspace = true }

anyhow     = { workspace = true }
switchy_fs = { workspace = true, features = ["native-directories"] }
tempfile   = { workspace = true }
toml       = { workspace = true }

[lints]
workspace = true
